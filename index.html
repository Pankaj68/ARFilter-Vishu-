<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Greeting Card Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  background: #000;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Screens */
#cameraScreen,
#cread {
  display: none;
}

/* CAMERA */
#cameraScreen {
  background: #000;
}

#cameraScreen video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1); /* 🔥 mirror preview */
}

/* FRAME OVERLAY */
#frameOverlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover; /* 🔥 correct scaling */
  pointer-events: none;
  z-index: 2;
}

/* BUTTONS */
button {
  padding: 12px 16px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  background: #ff3d00;
  color: #fff;
}

#captureBtn {
  position: absolute;
  bottom: 12%;
  z-index: 3;
}

/* FINAL IMAGE */
#cread {
  background: #000;
}

#creadImg {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#share {
  position: absolute;
  bottom: 4%;
  z-index: 5;
}
</style>
</head>

<body>

<!-- START -->
<div id="startScreen" class="screen">
  <button id="startBtn">Start Camera</button>
</div>

<!-- CAMERA -->
<div id="cameraScreen" class="screen">
  <video id="video" autoplay playsinline></video>
  <img id="frameOverlay" src="SLIDE 3.png" />
  <button id="captureBtn">Capture Photo</button>
</div>

<!-- FINAL -->
<div id="cread" class="screen">
  <img id="creadImg" />
  <button id="share">Share Card</button>
</div>

<script>
const startBtn = document.getElementById("startBtn");
const captureBtn = document.getElementById("captureBtn");
const shareBtn = document.getElementById("share");

const startScreen = document.getElementById("startScreen");
const cameraScreen = document.getElementById("cameraScreen");
const creadScreen = document.getElementById("cread");

const video = document.getElementById("video");
const frameImg = document.getElementById("frameOverlay");
const creadImg = document.getElementById("creadImg");

let cameraStream = null;

/* OPEN CAMERA */
async function openCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
  }

  cameraStream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    },
    audio: false
  });

  video.srcObject = cameraStream;
}

/* START */
startBtn.onclick = async () => {
  startBtn.disabled = true;
  startScreen.style.display = "none";
  cameraScreen.style.display = "flex";
  await openCamera();
};

/* CAPTURE PHOTO */
captureBtn.onclick = () => {
  const scale = 2; // 🔥 high quality
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = video.videoWidth * scale;
  canvas.height = video.videoHeight * scale;

  ctx.scale(scale, scale);

  // 🔥 mirror canvas to match preview
  ctx.translate(video.videoWidth, 0);
  ctx.scale(-1, 1);

  ctx.drawImage(video, 0, 0, video.videoWidth, video.videoHeight);
  ctx.drawImage(frameImg, 0, 0, video.videoWidth, video.videoHeight);

  creadImg.src = canvas.toDataURL("image/png");

  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }

  cameraScreen.style.display = "none";
  creadScreen.style.display = "flex";
};

/* SHARE */
shareBtn.onclick = async () => {
  const canvas = await html2canvas(creadImg, {
    scale: 2,
    backgroundColor: null
  });

  canvas.toBlob(async blob => {
    const file = new File([blob], "greeting-card.png", { type: "image/png" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: "Greeting Card"
      });
    } else {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "greeting-card.png";
      link.click();
    }
  });
};

/* SAFETY */
document.addEventListener("visibilitychange", () => {
  if (document.hidden && cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
});
</script>

</body>
</html>
